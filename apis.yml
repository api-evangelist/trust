name: Trust
description: Trust (Trust Software Inc., trust.co) was a fintech and marketing-technology
  startup founded in 2019 by James Borow, backed by a 2020 seed investment from Lightspeed
  Venture Partners. It began as a corporate card and community giving digital businesses
  higher credit limits and extended payment terms on marketing spend, then pivoted
  to Market (withmarket.com), an AI marketing assistant that let Shopify merchants
  chat with their business data. As of July 2026 both trust.co and withmarket.com
  no longer resolve in DNS and the company appears to have wound down. No public
  API, developer portal, or SDK surface was ever published.
